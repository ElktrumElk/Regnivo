server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # BrowserRouter routes resolve to the React entry point on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
